<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC-14 タグ登録 - 言語学雑学管理システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-size:12px;font-family:sans-serif;background:#fff;color:#222}
a{text-decoration:none;color:inherit}
.nav{display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:0.5px solid #ddd}
.nav-title{font-size:13px;font-weight:500;margin-right:8px}
.nav-link{font-size:11px;color:#666}
.nav-link.active{color:#BA7517;font-weight:500}
.toolbar{display:flex;gap:6px;padding:6px 16px;border-bottom:0.5px solid #ddd;align-items:center;background:#f7f7f5}
.btn{height:24px;padding:0 10px;border:0.5px solid #ccc;border-radius:6px;font-size:11px;background:none;color:#666;cursor:pointer}
.btn.primary{background:#BA7517;color:#fff;border-color:#BA7517}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:10px;font-weight:500;color:#999}
.field-label .req{color:#c00;margin-left:2px}
input[type=text]{width:100%;border:0.5px solid #ccc;border-radius:6px;padding:6px 8px;font-size:11px;color:#222;background:#fff}
input:focus{outline:none;border-color:#BA7517}
.hint{font-size:10px;color:#999;margin-top:2px}
.preview{display:inline-block;background:#FAEEDA;color:#633806;font-size:11px;padding:3px 10px;border-radius:99px;margin-top:6px}
.form-actions{display:flex;gap:8px;padding:0 16px 16px}
</style>
</head>
<body>
  <div class="nav">
    <span class="nav-title">言語学雑学</span>
    <a class="nav-link" href="SC-01_home.html">ホーム</a>
    <a class="nav-link" href="SC-02_trivia_list.html">雑学</a>
    
    <a class="nav-link" href="SC-10_video_list.html">動画</a>
    <a class="nav-link active" href="SC-13_tag_list.html">タグ</a>
  </div>
  <div class="toolbar">
    <a href="SC-13_tag_list.html"><button class="btn">← 一覧に戻る</button></a>
  </div>
  <div class="form">
    <div class="field">
      <label class="field-label">タグ名<span class="req">*</span></label>
      <input type="text" placeholder="例：フランス語">
      <div class="hint">雑学に付けるラベルです。重複しないよう注意してください。</div>
      <div class="preview">プレビュー：フランス語</div>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn primary">登録する</button>
    <a href="SC-13_tag_list.html"><button class="btn">キャンセル</button></a>
  </div>
</body>
</html>
